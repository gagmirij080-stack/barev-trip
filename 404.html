<title>404 — Էջը չի գտնվել | Barev.trip</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
       font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#e8eaf0;
       background:radial-gradient(circle at 50% 0%,#1b2742 0%,#0f172a 45%,#080d18 100%);
       padding:32px;overflow:hidden}
  .glow{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.35;
        background:#d97706;top:-220px;left:50%;transform:translateX(-50%);pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:640px}
  .logo{font-family:"Playfair Display",serif;font-size:26px;letter-spacing:.5px;margin-bottom:28px;color:#fff}
  .logo span{color:#d97706;font-style:italic}
  .code{font-family:"Playfair Display",serif;font-size:clamp(96px,20vw,180px);line-height:1;font-weight:700;
        background:linear-gradient(180deg,#f9d9a3 0%,#d97706 55%,#8a4a05 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
  h1{font-size:clamp(20px,3vw,28px);font-weight:800;margin-bottom:14px;color:#fff}
  p{color:#9aa4b8;line-height:1.7;font-size:15px;margin-bottom:30px}
  .btn{display:inline-block;padding:14px 30px;border-radius:999px;background:#d97706;color:#fff;
       text-decoration:none;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(217,119,6,.35);
       transition:transform .25s ease,box-shadow .25s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(217,119,6,.45)}
  .hint{margin-top:22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6577}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="logo">Barev<span>.trip</span></div>
  <div class="code">404</div>
  <h1>Էջը չի գտնվել</h1>
  <p>Այն, ինչ փնտրում եք, գոյություն չունի կամ տեղափոխվել է։<br>Страница не найдена, но Армения на месте.</p>
  <a class="btn" href="/barev-trip/">Վերադառնալ գլխավոր</a>
  <div class="hint">Wood fire · Restoran · Armenia</div>
</div>
</body>
